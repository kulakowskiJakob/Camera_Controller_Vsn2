<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>H.264 Stream Viewer</title>
    <style>
        body {
            background: #222;
            color: #eee;
            font-family: Arial;
            text-align: center;
        }
        canvas {
            margin-top: 20px;
            background: black;
        }
    </style>
</head>
<body>

<h2>H.264 Video Stream Viewer</h2>
<p>Streaming from: /video</p>

<canvas id="videoCanvas" width="1280" height="720"></canvas>

https://unpkg.com/ffmpeg.js/ffmpeg-mp4.js
<script>
    const canvas = document.getElementById("videoCanvas");
    const ctx = canvas.getContext("2d");

    // FFmpeg.js wrapper
    const ffmpeg = new FFmpeg();
    ffmpeg.on("ready", startStream);

    function startStream() {
        const source = new ReadableStream({
            start(controller) {
                fetch("/video")
                    .then(response => {
                        const reader = response.body.getReader();
                        function pump() {
                            reader.read().then(({ done, value }) => {
                                if (done) return;
                                controller.enqueue(value);
                                pump();
                            });
                        }
                        pump();
                    });
            }
        });

        // Process stream through FFmpeg
        ffmpeg.readFromStream(source, {
            codec: "h264",
            width: 1280,
            height: 720,
            pixFmt: "rgba"
        }).then(decoder => {
            function render() {
                const frame = decoder.readFrame();
                if (frame) {
                    ctx.putImageData(new ImageData(frame.data, frame.width, frame.height), 0, 0);
                }
                requestAnimationFrame(render);
            }
            render();
        });
    }
</script>

</body>
</html>
